name: enterprise-network-lab

topology:
  nodes:
    hq-rtr:
      kind: linux
      image: frrouting/frr:latest
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
        - ./configs/hq-rtr/frr.conf:/etc/frr/frr.conf
        - ./configs/hq-rtr/daemons:/etc/frr/daemons

    branch-rtr:
      kind: linux
      image: frrouting/frr:latest
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
        - ./configs/branch-rtr/frr.conf:/etc/frr/frr.conf
        - ./configs/branch-rtr/daemons:/etc/frr/daemons

    hq-it:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: sleep infinity
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
        - ip route add 10.20.30.0/24 via 10.10.10.1

    hq-users:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: sleep infinity
      exec:
        - ip addr add 10.10.20.10/24 dev eth1
        - ip route add 10.20.30.0/24 via 10.10.20.1

    branch-user:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: sleep infinity
      exec:
        - ip addr add 10.20.30.10/24 dev eth1
        - ip route add 10.10.10.0/24 via 10.20.30.1
        - ip route add 10.10.20.0/24 via 10.20.30.1

  links:
    - endpoints: ["hq-rtr:eth1", "branch-rtr:eth1"]
    - endpoints: ["hq-rtr:eth2", "hq-it:eth1"]
    - endpoints: ["hq-rtr:eth3", "hq-users:eth1"]
    - endpoints: ["branch-rtr:eth2", "branch-user:eth1"]
