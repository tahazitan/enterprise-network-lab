frr defaults traditional
hostname branch-rtr
service integrated-vtysh-config
!
interface eth1
 description WAN-underlay
 ip address 172.16.255.2/30
!
interface eth2.30
 description VLAN30-Branch-Users
 ip address 10.20.30.1/24
!
router ospf
 ospf router-id 2.2.2.2
 passive-interface default
 no passive-interface eth1
 network 172.16.255.0/30 area 0
 network 10.20.30.0/24 area 0
!
line vty
!
